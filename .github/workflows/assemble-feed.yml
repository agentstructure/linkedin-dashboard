name: Assemble feed
on:
  push:
    paths:
      - 'parts/feed.zlib.part*'
      - '.github/workflows/assemble-feed.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble linkedin-outreach-feed.json
        run: |
          python3 - <<'PY'
          import base64, pathlib, zlib, json
          parts = sorted(pathlib.Path('parts').glob('feed.zlib.part*'))
          b64 = ''.join(p.read_text().strip() for p in parts)
          data = zlib.decompress(base64.b64decode(b64))
          pathlib.Path('linkedin-outreach-feed.json').write_bytes(data)
          json.loads(data)
          print('wrote', len(data), 'bytes from', len(parts), 'parts')
          PY
      - name: Commit assembled feed
        run: |
          git config user.name "AgentStructure.AI"
          git config user.email "support@agentstructure.ai"
          git add linkedin-outreach-feed.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update linkedin-outreach-feed.json for Grok dashboard live feed"
          git push
