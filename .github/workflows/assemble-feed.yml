name: Assemble feed
on:
  push:
    paths:
      - 'parts/feed.part*.txt'
      - '.github/workflows/assemble-feed.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble linkedin-outreach-feed.json
        run: |
          cat parts/feed.part*.txt > linkedin-outreach-feed.json
          python3 -c "import json; json.load(open('linkedin-outreach-feed.json')); print('valid json', open('linkedin-outreach-feed.json').seek(0) or open('linkedin-outreach-feed.json').tell() if False else __import__('pathlib').Path('linkedin-outreach-feed.json').stat().st_size)"
      - name: Commit assembled feed
        run: |
          git config user.name "AgentStructure.AI"
          git config user.email "support@agentstructure.ai"
          git add linkedin-outreach-feed.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update linkedin-outreach-feed.json for Grok dashboard live feed"
          git push
